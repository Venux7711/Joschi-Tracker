name: Datenbank-Migrationen

# Spielt neue supabase/migrations/*.sql automatisch in die Supabase-DB ein,
# sobald sie auf main landen. Braucht nur ein Secret: SUPABASE_ACCESS_TOKEN
# (Personal Access Token aus https://supabase.com/dashboard/account/tokens).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/scripts/apply-migrations.mjs'
      - '.github/workflows/db-migrations.yml'
  workflow_dispatch: {}

# Nie zwei Migrationsläufe gleichzeitig
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      # v4 lief intern noch auf Node.js 20; GitHub schob das übergangsweise auf
      # Node.js 24 und warnte. v7 bringt Node.js 24 selbst mit.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Ausstehende Migrationen anwenden
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ixxmxzwkuassekwumyth
        run: node .github/scripts/apply-migrations.mjs
